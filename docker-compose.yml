services:
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: rag_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: rag_app_api
    # Phase 3: --workers 2 keeps two event-loop workers ready for concurrent requests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 300 --workers 2
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - redis

volumes:
  qdrant_storage:
  redis_data:
  hf_cache: